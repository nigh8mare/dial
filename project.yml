name: FieldVisitLog
options:
  bundleIdPrefix: com.rbriana
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  FieldVisitLog:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Visit Log
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBg
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSMicrophoneUsageDescription: Record voice memos about a visit and attach them to that visit.
        NSSpeechRecognitionUsageDescription: Turn your visit recordings into text so Visit Scribe can draft the visit note.
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: Take a photo to attach to a visit.
        NSPhotoLibraryUsageDescription: Attach a photo or recording from your library to a visit.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rbriana.fieldvisitlog
        PRODUCT_NAME: VisitLog
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
