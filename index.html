<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Dial</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:16px;padding:16px;font:17px -apple-system,system-ui,sans-serif;
       background:#f4f2ed;color:#151c22;text-align:center}
  a.btn{display:inline-block;padding:16px 28px;border-radius:999px;background:#1d5f72;
        color:#fff;font-weight:700;text-decoration:none;font-size:20px}
  .hint{font-size:13px;color:#7d8a92;max-width:32ch}
</style>
</head>
<body>
  <p id="msg">Opening Phone…</p>
  <a id="go" class="btn" href="#" hidden>Call</a>
  <p class="hint">Close this tab when you're done.</p>
<script>
  // Link format: https://nigh8mare.github.io/dial/#tel:9494134026  (or #sms:9494134026)
  // Everything after "#" stays in the phone's browser; it is never sent to GitHub.
  var h = decodeURIComponent(location.hash.slice(1));
  var kind = /^sms:/i.test(h) ? "sms" : "tel";
  var digits = h.replace(/^(tel|sms):/i, "").replace(/\D/g, "").slice(-10);
  var msg = document.getElementById("msg"), go = document.getElementById("go");
  if (digits.length === 10) {
    var pretty = digits.slice(0,3) + "-" + digits.slice(3,6) + "-" + digits.slice(6);
    var url = kind + ":+1" + digits;
    go.href = url;
    go.textContent = (kind === "sms" ? "Text " : "Call ") + pretty;
    go.hidden = false;
    msg.textContent = kind === "sms" ? "Opening Messages…" : "Opening Phone…";
    location.href = url;
  } else {
    msg.textContent = "No phone number in this link.";
  }
</script>
</body>
</html>
