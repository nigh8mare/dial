<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Dial</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:14px;padding:16px;font:17px -apple-system,system-ui,sans-serif;
       background:#f4f2ed;color:#4d5a63;text-align:center}
  #go{color:#1d5f72;font-weight:600;font-size:15px}
  .hint{font-size:13px;color:#7d8a92}
</style>
</head>
<body>
  <p id="msg">Opening Phone…</p>
  <a id="go" href="#" hidden>Didn't open? Tap to call</a>
  <p class="hint">Close this tab when you're done.</p>
<script>
  // Link format: https://nigh8mare.github.io/dial/#tel:9494134026  (or #sms:9494134026)
  // Everything after "#" stays in the phone's browser; it is never sent to GitHub.
  var h = decodeURIComponent(location.hash.slice(1));
  var kind = /^sms:/i.test(h) ? "sms" : "tel";
  var digits = h.replace(/^(tel|sms):/i, "").replace(/\D/g, "").slice(-10);
  var msg = document.getElementById("msg"), go = document.getElementById("go");
  if (digits.length === 10) {
    var url = kind + ":+1" + digits;
    msg.textContent = kind === "sms" ? "Opening Messages…" : "Opening Phone…";
    go.href = url;
    if (kind === "sms") go.textContent = "Didn't open? Tap to text";
    location.href = url;                                   // iPhone's own prompt appears
    setTimeout(function(){ go.hidden = false; }, 3000);   // small backup link only
  } else {
    msg.textContent = "No phone number in this link.";
  }
</script>
</body>
</html>
